      THESIS: The offer isn't judged by story, it's judged row by row against a compliance
      matrix — this page treats the pitch itself as a live evaluation rubric turning to CUMPLE.
      OWN-WORLD: near-black ink (#161213) on true white (#ffffff), with the brand maroon
      (#620a20) as the single carried color for cumple/CTA/brand mark; pending states stay
      achromatic gray so maroon reads as the one signal, matching the client's real GECOP EXPERT
      mark (maroon checkmark-in-square + wordmark on white). Spectral display serif, Inter body,
      JetBrains Mono for rubric codes and status marks. Rubric rows, ledger lines, stamped status
      chips — no cards-plus-icon grid, no gradient hero, no stock handshake photo.
      STORY: A proveedor del Estado under deadline pressure sees GECOP EXPERT visibly clearing
      every requirement row of the evaluation matrix, then books a cita via form or WhatsApp.
      FIRST VIEWPORT: Full-bleed rubric hero — four live rows (habilitación legal, capacidad
      técnica, oferta económica, experiencia) flipping pending→CUMPLE in sequence, slogan set in
      Spectral beneath, primary CTA "Solicita tu asesoría" plus WhatsApp secondary, both left-
      aligned under the matrix at the scale the rubric itself commands.
      FORM: Matriz de Evaluación — assigned index 3 of 7, concept-seed key 1891ecc6, mode persuade.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
